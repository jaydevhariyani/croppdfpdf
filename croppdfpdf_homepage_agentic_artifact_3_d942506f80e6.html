ne tool works right in your browser — no software to install, no watermark added, and your files are deleted automatically after 1 hour. Whether you are a student compiling assignments, an office executive merging monthly reports, or an e-commerce seller combining AWB and invoice for dispatch, merging saves time and avoids printing mistakes. The tool preserves original quality, keeps fonts and barcodes sharp, and lets you reorder pages before final download.",whatTitle:"What is Merge PDF and why do you need it?",whatPara:"Merge PDF is a simple utility that takes two or more PDF files and joins them into a single PDF. Instead of sending 5 separate attachments to a client or courier partner, you can create one organized file. The order matters — you can drag files to set sequence, for example, invoice first, then shipping label, then warranty card. For businesses, this is critical for documentation and audits.",whatPara2:"Unlike offline software that adds watermarks or limits pages, our tool is unlimited for up to 500 files or 100MB combined. It keeps the original resolution intact, so scanned documents remain readable and barcodes stay scannable. It works on mobile too, so you can merge on your phone while at the warehouse. All processing is secure, with no file content stored on our servers after auto-deletion.",steps:[{title:"Upload PDFs",desc:"Click Choose files or drag up to 500 PDFs. They will appear in a list. Maximum combined size is 100MB."},{title:"Arrange order",desc:"Drag files up or down to set the final sequence. For sellers: keep invoice first, then label."},{title:"Preview & Merge",desc:"Check file names and page counts. Click Merge Now. The tool combines them without losing quality."},{title:"Download",desc:"Download the merged PDF instantly. File auto-deletes in 1 hour. No signup needed."}],featuresTitle:"Key features of our Merge PDF tool",features:[{title:"Preserve quality",desc:"Fonts, images, barcodes and scanned pages stay crisp. No compression or watermark added."},{title:"Reorder easily",desc:"Drag and drop to change order. Add more files in between without starting over."},{title:"No limit hassle",desc:"Merge up to 500 files at once. Ideal for bulk sellers handling daily orders."},{title:"Fast & secure",desc:"Browser-based, works in seconds. Files encrypted in transit and deleted in 1 hour."}],ecommerceTitle:"Merge tool for Amazon, Flipkart & Meesho sellers",ecommerceIntro:"E-commerce sellers in India often download separate PDFs: one for tax invoice, one for shipping label, and one for return form. Couriers like Delhivery and Xpressbees ask for a single combined PDF. With Merge PDF, you can join them in the exact order your logistics partner wants. This reduces dispatch errors and speeds up packing.",ecommercePoints:[{title:"Amazon FBA",desc:"Merge FBA box label + product invoice + pallet sheet into one ready-to-print file."},{title:"Flipkart SmartShip",desc:"Combine Flipkart invoice and Ekart shipping label so warehouse staff can print in one go."},{title:"Meesho supplier",desc:"Join multiple customer orders from same city into one PDF to save thermal paper."}],extraTitle:"Why choose our merge tool over others?",extraPara:"Many free tools online inject ads inside your PDF or reduce quality. We don't. Our focus is clean output for business use. The tool is optimized for Indian sellers — it handles both English and Hindi invoices, small thermal fonts, and A4 sheets correctly. You can also merge after cropping or rotating labels, so you can build a complete workflow: crop A4 to 4x6, then merge with invoice.",extraPara2:"Pro tip: If your merged file is too large for marketplace upload, use our Optimize PDF tool right after merging. That way you keep one file, small size, no quality loss for barcodes. Always keep original files backup for GST audits.",tips:["Upload files in final order to save time","Keep combined size under 10MB for faster email sharing","Use file names like 01_Invoice, 02_Label for auto-sorting"],faqs:[{q:"Can I merge PDFs with different page sizes?",a:"Yes. A4 invoices and 4x6 labels can be merged together. Each page keeps its original size — perfect for sellers who need both sizes in one document."},{q:"Will merged PDF lose barcode quality?",a:"No. We preserve original resolution. Your shipping barcode remains 100% scannable for courier scanners."},{q:"Is there a limit to merge?",a:"You can merge up to 500 files, 100MB total. For most sellers that is 200+ orders in one batch. Files are deleted after 1 hour for privacy."},{q:"Can I reorder after uploading?",a:"Yes. Simply drag files to reorder before clicking merge. No need to re-upload."}]},split:{h1:"Split PDF Online Free - Separate PDF Pages Instantly",uploadLabel:"Choose PDF to split",uploadHint:"Separate invoices, labels or chapters in one click",intro:"Have a 50-page PDF but need only 2 pages? Our Split PDF tool lets you extract specific pages or break one file into multiple smaller PDFs. This is essential for sharing only relevant sections, separating bulk label sheets, or dividing a large catalog. The tool is completely free, works online without any watermark, and deletes your file after 1 hour for privacy. You can split by page range, extract every page as separate file, or remove unwanted sections. It preserves text quality, fonts, and barcodes perfectly. For students, office teams and e-commerce sellers, splitting saves paper and prevents confidential data leaks.",whatTitle:"What is Split PDF and when to use it?",whatPara:"Split PDF means dividing one PDF into two or more files. For example, a single download from Flipkart contains invoice + shipping label + tax form on same A4 sheet. You may need only the shipping label for thermal printer. With split, you extract that page alone. Similarly, a 100-page product manual can be split into chapters for easy sharing.",whatPara2:"Our tool offers three modes: extract pages (e.g., pages 2-4), split by every page, or split by fixed range. You don't need to install Adobe Acrobat or pay. Everything happens in browser, even on low-end Android phones. No email required. Output files keep original clarity, so scanned labels remain sharp.",steps:[{title:"Upload PDF",desc:"Choose file up to 100MB. Bulk label sheets from Amazon or Shiprocket work fine."},{title:"Choose split mode",desc:"Select extract pages, split each page separately, or split by range like 1-2, 3-4."},{title:"Select pages",desc:"Type page numbers or click thumbnails. For 4-up label sheets, select one label area per split."},{title:"Download files",desc:"Get a ZIP with all split PDFs or download individual files. Auto-delete after 1 hour."}],featuresTitle:"Benefits of splitting PDFs",features:[{title:"Extract exactly",desc:"Get only needed pages. Avoid sharing full file with sensitive pricing or customer data."},{title:"Bulk label split",desc:"Convert A4 sheet with 4 labels into 4 separate 4x6 PDFs for thermal printing."},{title:"No quality loss",desc:"Barcodes, QR codes and small fonts remain original resolution, no blur."},{title:"Privacy first",desc:"Files deleted after 1 hour. We never read content. Secure for business documents."}],ecommerceTitle:"How sellers use Split PDF daily",ecommerceIntro:"Marketplaces give you a single PDF with 4 labels per A4. Couriers need one label per package. Splitting is the fastest way to separate them. It also helps when you download 50 orders as one file and need to forward specific orders to packing team.",ecommercePoints:[{title:"Amazon bulk orders",desc:"Split 50-order manifest into individual invoices so you can pick faster in warehouse."},{title:"Shiprocket AWB",desc:"Split A4 with 2 AWB slips into two 4x6 files, avoiding half-page waste on thermal printer."},{title:"Meesho returns",desc:"Extract only return label pages to share with delivery boy without exposing other customers."}],extraTitle:"Split smart - save ink and time",extraPara:"Printing full A4 when you need only 4x6 wastes paper and ink. Splitting lets you print exactly what needed. Combined with our Crop and Resize tools, you can first split, then crop to exact size, then merge orders city-wise. This workflow is used by top sellers in Surat, Jaipur and Tirupur.",extraPara2:"If you handle GST audits, split helps keep financial year files separate. You can split a yearly ledger into monthly PDFs for CA sharing. Always name split files with order ID to avoid confusion during dispatch.",tips:["Use page range like 1,3,5-7 for non-continuous extraction","Download as ZIP when splitting into many files","Split before cropping for cleaner 4x6 output"],faqs:[{q:"Can I split a PDF with 4 labels on one page?",a:"For same-page 4 labels, use Crop first to isolate each label, then Split if you have multi-page sheet. Or use N-UP reverse workflow."},{q:"Does split reduce file quality?",a:"No. Splitting copies pages as-is. Original DPI and text layer remain intact."},{q:"How many files can I create?",a:"Up to 500 files from one PDF. Each split file is counted towards 100MB total limit."}]},resize:{h1:"Resize PDF to 4x6, A4, Letter - Free Online Tool",uploadLabel:"Choose PDF to resize",uploadHint:"Convert A4 to 4x6 thermal label size",intro:"Need to change PDF page size from A4 to 4x6 inch for thermal printer? Our Resize PDF tool lets you change page dimensions without distorting content. This is crucial for e-commerce shipping labels because Amazon, Flipkart and Shiprocket require exact 4x6 inch (10x15 cm) labels for barcode scanners to work. The tool is free, no watermark, secure and deletes files after 1 hour. It can scale content to fit new size, center it, or keep aspect ratio. Works for students resizing assignments to A4, offices converting Letter to Legal, and sellers converting invoices to label size. Preserves text sharpness and image resolution.",whatTitle:"What does Resize PDF do?",whatPara:"Resize PDF changes the paper size of your PDF pages. Unlike cropping which cuts content, resizing keeps all content but fits it into new dimensions like 4x6, A5, A4, Letter. You can choose to scale content up or down, add white margins, or stretch to fill. This is useful when printer expects specific size.",whatPara2:"For example, you have an invoice generated in A4 but your thermal printer only supports 4x6 rolls. Resizing converts page box to 4x6 and scales content proportionally. Barcodes stay readable because we use high-quality scaling. The tool works in browser, no installation, supports up to 500 files at once.",steps:[{title:"Upload PDF",desc:"Select file. Supports PDF with invoices, labels, certificates, photos."},{title:"Choose new size",desc:"Pick preset: 4x6 inch, A4, A5, Letter, Legal or enter custom cm/inch."},{title:"Set scaling",desc:"Choose fit to page, center, or stretch. For labels, use fit to keep barcode ratio."},{title:"Download resized",desc:"Download print-ready file. Check preview to ensure no text cutoff."}],featuresTitle:"Why resizing matters",features:[{title:"4x6 thermal ready",desc:"One-click conversion to 10x15 cm for all Indian courier partners - Delhivery, Bluedart, Ekart."},{title:"No distortion",desc:"Smart scaling keeps aspect ratio. Barcodes and QR codes not stretched."},{title:"Batch resize",desc:"Resize 100+ labels together to same size in one go."},{title:"Add margins",desc:"Add extra white border for binding or to avoid printer cutting off edges."}],ecommerceTitle:"Resize for marketplace compliance",ecommerceIntro:"Different platforms have different label rules. Amazon prefers 4x6, some older Flipkart manifests are A4. Shiprocket AWB can be A5. Resizing ensures you comply without recreating label manually. This avoids RTO due to unreadable barcode.",ecommercePoints:[{title:"A4 → 4x6 conversion",desc:"Convert supplier invoice + label A4 sheet to pure 4x6 label for thermal printer."},{title:"Shopify shipping",desc:"Resize Shopify-generated Letter size labels to 4x6 for local thermal printer."},{title:"Myntra partner",desc:"Myntra returns need A4 - resize 4x6 return AWB back to A4 for regular printer."}],extraTitle:"Resize vs Crop - which to use?",extraPara:"Use Resize when you need whole page but smaller paper. Use Crop when you need part of page. Many sellers need both: first crop extra white area around label, then resize to exact 4x6. This gives perfect output with no wasted space. Our tool lets you chain operations.",extraPara2:"Always test print one label after resizing. Check barcode with phone scanner app. If barcode is too small, choose stretch mode. Keep original A4 backup for GST records as required by Indian tax law for 5 years.",tips:["For thermal printer use 4x6 inch at 100% scale","Add 3mm margin if printer cuts edges","Resize before merging to keep uniform size"],faqs:[{q:"Will resizing make barcode blurry?",a:"No, we preserve vector data. Barcode remains sharp. Only scanned image labels may slightly soften, but still scannable."},{q:"Can I resize A4 invoice to 4x6 without cutting?",a:"Yes, choose fit to page. Whole invoice shrinks to 4x6. If you only need shipping part, crop first then resize."},{q:"What sizes are supported?",a:"Presets: 4x6, 3x5, A0-A6, Letter, Legal, Tabloid plus custom size in inch, mm, cm."}]},convert:{h1:"Convert PDF to JPG, Word, Excel - Free Online Converter",uploadLabel:"Choose file to convert",uploadHint:"PDF to JPG, Word, Excel or image to PDF",intro:"Need to turn PDF invoice into JPG for WhatsApp sharing, or convert product photo to PDF for listing? Our Convert PDF tool handles all common conversions free, online, with no watermark. It supports PDF to JPG, PNG, Word (DOCX), Excel, PowerPoint and reverse: JPG to PDF, Word to PDF. Conversion preserves layout, fonts and quality. Files are auto-deleted in 1 hour, so your business data stays private. Perfect for students submitting assignments, offices converting reports, and sellers converting label images to PDF for printing. Works on mobile, fast even on Jio network, no signup needed.",whatTitle:"What can you convert?",whatPara:"Convert PDF tool is a two-way converter. You can convert PDF to images (JPG, PNG, TIFF) for easy sharing, or convert images and Office files into PDF for professional documentation. For example, a supplier sends you product photo as JPG but marketplace requires PDF catalog — convert in one click. Or you have PDF invoice but customer asks on WhatsApp — convert to JPG for quick send.",whatPara2:"We use high-quality conversion engine that keeps text selectable when converting to Word, and keeps image resolution when converting to JPG. Unlike many free sites, we don't add watermark logo on your converted files. You get up to 500 conversions per batch, 100MB total. All conversions are secure and original quality is maintained as much as format allows.",steps:[{title:"Upload file",desc:"Choose PDF, JPG, PNG, DOCX, XLSX or PPTX. You can upload up to 500 files."},{title:"Pick format",desc:"Select output: JPG, PDF, Word, Excel etc. For labels choose JPG or PDF."},{title:"Convert",desc:"Click Convert. Engine processes files in seconds, even large catalogs."},{title:"Download",desc:"Download converted files. Auto-delete after 1 hour for privacy."}],featuresTitle:"Conversion features sellers love",features:[{title:"High fidelity",desc:"Text, tables and images keep original look. Excel conversion keeps formulas layout."},{title:"Image to PDF",desc:"Turn multiple product photos into one PDF catalog for buyer sharing."},{title:"No watermark",desc:"Clean output ready for customer or courier. No branding added."},{title:"Bulk convert",desc:"Convert 100 invoices to JPG for WhatsApp broadcast in one batch."}],ecommerceTitle:"E-commerce use cases",ecommerceIntro:"Marketplace operations need constant format changes. Amazon asks for PDF invoices but Facebook ads need JPG. Shiprocket accepts PDF AWB but thermal printer driver sometimes needs JPG. Convert tool bridges this gap instantly.",ecommercePoints:[{title:"WhatsApp sharing",desc:"Convert PDF invoice to JPG so customer can view without PDF reader on low-end phone."},{title:"Listing images",desc:"Convert JPG product photos to PDF for Amazon listing documentation or brand registry."},{title:"Excel reports",desc:"Convert PDF sales report from Flipkart to Excel for accounting in Tally or Vyapar."}],extraTitle:"Tips for best conversion quality",extraPara:"When converting PDF to JPG for thermal printing, choose 300 DPI for sharp barcode. When converting JPG to PDF for marketplace upload, keep page size as 4x6 if it's a label, else A4. For Word conversion, scanned PDFs become image in Word — you need OCR for text recognition, which we plan to add soon.",extraPara2:"Always keep original file until you verify converted output. Check barcode scan after PDF to JPG conversion. For GST, keep both PDF and Excel versions for CA audit.",tips:["Use JPG 300 DPI for printable labels","Convert images to single PDF catalog to save sharing time","PDF to Excel works best for text-based PDFs, not scanned"],faqs:[{q:"Can I convert JPG shipping label to PDF?",a:"Yes. Upload JPG, choose to PDF, select page size 4x6. You get print-ready PDF for thermal printer."},{q:"Will PDF to Word keep table structure?",a:"Yes for digital PDFs. Text and tables remain editable. Scanned PDFs become images in Word."},{q:"Is conversion secure?",a:"Yes. Files encrypted and deleted after 1 hour. We don't store or read your business documents."}]},crop:{h1:"Crop PDF Online Free - Remove White Margins & Cut Labels to 4x6",uploadLabel:"Choose, paste or drag PDF here",uploadHint:"Crop invoices, A4 sheets to 4x6 thermal labels",intro:"Our Crop PDF tool helps you remove unwanted white margins, cut specific areas, or convert A4 sheets with multiple shipping labels into single 4x6 inch thermal labels. This free online tool works directly in your browser — no installation, no watermark, and your files are automatically deleted after 1 hour. Whether you are a student removing extra borders from scanned notes, an office executive cleaning up reports, or an e-commerce seller in India preparing Amazon, Flipkart, Meesho or Shiprocket labels, cropping is essential. You can visually drag the crop box, zoom for precision, and apply crop to one page or all pages. The tool preserves original quality so barcodes stay scannable and text remains crisp.",whatTitle:"What is PDF cropping and why it matters for Indian sellers?",whatPara:"PDF cropping changes the visible page area without deleting content permanently. It sets a new page box. For example, a courier company gives you A4 PDF containing 4 shipping labels (2x2 grid). Your thermal printer needs one label per 4x6 roll. By cropping, you select one label quadrant and create a perfect 4x6 print-ready PDF. Similarly, scanned documents often have large black borders — cropping removes them.",whatPara2:"For e-commerce, correct label size is critical. If you print A4 label on 4x6 paper, barcode gets cut and shipment goes into RTO, costing you money. Our tool lets you crop precisely to 10x15 cm (4x6 inch), the standard size accepted by Delhivery, Xpressbees, Ekart, Blue Dart and DTDC. The tool supports batch cropping — apply same crop box to all pages, saving hours for sellers handling 100+ orders daily from Surat, Delhi, Mumbai hubs.",steps:[{title:"Upload PDF",desc:"Click Choose files or drag your A4 invoice + label PDF. Supports up to 500 files, 100MB combined. PDF, JPG, PNG all supported."},{title:"Select crop area",desc:"Drag rectangle around label. Use zoom and guides. For thermal labels, set aspect to 4x6 (10x15 cm) to avoid distortion."},{title:"Apply to pages",desc:"Choose current page, page range or all pages. For 4-up sheets, crop each page individually for accuracy."},{title:"Download cropped",desc:"Click Crop and download. Print-ready 4x6 file. Original file auto-deleted after 1 hour for privacy."}],featuresTitle:"Cropping modes for every need",features:[{title:"Manual crop to selection",desc:"Drag margins visually. Best for removing headers, footers, scanning borders or isolating one label from A4."},{title:"Auto-crop white margins",desc:"Tool auto-detects white space and trims it on all pages in one click. Saves ink and paper."},{title:"Fixed ratio 4x6",desc:"Lock aspect to 4x6 inch / 10x15 cm for thermal printers. Ensures barcode size compliance."},{title:"Extend margins",desc:"Add white space for binding or to center small label on 4x6 roll avoiding printer cutoff."}],ecommerceTitle:"Deep dive: A4 to 4x6 label cropping for Amazon, Flipkart, Meesho, Shiprocket",ecommerceIntro:"If you sell on Amazon FBA, Flipkart Seller Hub, Meesho Supplier Panel, Shopify or Shiprocket, you know the pain: marketplace generates A4 PDFs with 2 or 4 labels per page. Thermal printers like TSC, Arks, TVS need single 4x6. Cropping solves this. Our tool is built for Indian sellers with slow internet and high volume.",ecommercePoints:[{title:"Amazon FBA & EasyShip",desc:"Amazon gives A4 with invoice on top, label bottom. Crop bottom part only to get 4x6 FBA label. Keep invoice separate for GST."},{title:"Flipkart Ekart",desc:"Flipkart SmartShip manifest has 2 labels per A4. Crop first label, download, then crop second. Batch crop applies same box to all pages."},{title:"Shiprocket & Meesho",desc:"Shiprocket AWB for Delhivery, Xpressbees is often 2-up. Crop to exact 4x6 to avoid half-print waste. Meesho labels have extra ads — crop them out."}],extraTitle:"Why our crop tool is trusted by 10k+ sellers",extraPara:"Other tools compress your PDF and make barcode blurry, leading to courier scan failures and RTO losses. We keep original resolution. Our crop is non-destructive — it doesn't re-encode images, so print quality stays identical to original. The tool works offline after loading, so even with Jio 4G drops, cropping continues.",extraPara2:"Pro workflow: Upload bulk A4, auto-crop white margins, then manual crop to 4x6, then use Resize tool if needed to force 10x15 cm, then Merge to combine with invoice. This 3-step process is used by top sellers in Tirupur and Jaipur to dispatch 500 orders per hour. Files are deleted in 1 hour, so your customer data (address, phone) is safe as per India DPDP compliance mindset.",tips:["Use zoom to 150% for precise barcode edge cropping","Lock ratio to 4x6 before dragging for thermal accuracy","Crop one file first, then apply same box to all pages in batch"],faqs:[{q:"How do I crop A4 PDF with 4 shipping labels to 4x6?",a:"Upload A4 PDF, drag crop box around one label quadrant, set aspect to 4x6, click Crop. Repeat for each quadrant or use batch mode with same position. You get 4 separate 4x6 PDFs ready for thermal printer."},{q:"Will cropping reduce barcode quality or make it unscannable?",a:"No. Cropping only changes page box, not image DPI. Barcode stays at original resolution and remains 100% scannable for Delhivery, Ekart scanners."},{q:"Can I auto-crop all pages at once?",a:"Yes. After setting crop box on first page, choose Apply to all pages. Ideal when all labels are in same position across 100 pages."},{q:"Is my shipping label data safe?",a:"Yes. All files are auto-deleted after 1 hour. We don't read, copy or store customer addresses. Secure and private."}]},rotate:{h1:"Rotate PDF Pages Online Free - Fix Sideways Labels & Scans",uploadLabel:"Choose PDF to rotate",uploadHint:"Fix sideways shipping labels and scanned docs",intro:"Scanned a document and it came out sideways? Or Flipkart label printed at 90 degrees? Our Rotate PDF tool lets you rotate one or all pages 90°, 180° or 270° instantly. This free online tool works in browser, no watermark, no signup, and deletes files after 1 hour. Rotating is essential for correcting scanned invoices, fixing thermal label orientation for printers, and making PDFs readable on mobile. The tool preserves quality, keeps text searchable, and handles up to 500 files at once. Perfect for students fixing assignment scans, office staff correcting meeting notes, and e-commerce sellers aligning labels for thermal printing.",whatTitle:"What is PDF rotate and when you need it?",whatPara:"PDF rotate changes page orientation. Some scanners save pages in landscape when you need portrait, or vice versa. Thermal printers often need labels rotated 90 degrees because roll feeds differently. Without rotation, barcode prints sideways and courier can't scan, causing RTO.",whatPara2:"Our tool lets you rotate all pages or select specific pages. For example, if page 2 of invoice is sideways, rotate only that page. Rotation is lossless — we don't re-encode images, so quality stays perfect. Works even for large 100MB catalogs.",steps:[{title:"Upload PDF",desc:"Choose file with sideways pages. Supports bulk upload for sellers."},{title:"Select pages",desc:"Choose all pages or specific pages like 2,5-7. Click thumbnail to rotate individually."},{title:"Choose angle",desc:"Pick 90° clockwise, 90° counter, or 180°. For thermal labels try 90° first."},{title:"Download fixed",desc:"Download corrected PDF. Ready for printing or sharing."}],featuresTitle:"Rotate features",features:[{title:"Page-level control",desc:"Rotate only selected pages, not whole document. Useful for mixed orientation files."},{title:"Lossless",desc:"No quality loss. Barcodes and text remain sharp after rotation."},{title:"Bulk rotate",desc:"Rotate 500 labels together to same orientation in one click."},{title:"Preview",desc:"See thumbnail preview before download to avoid rework."}],ecommerceTitle:"Rotate for thermal printer alignment",ecommerceIntro:"Many sellers face issue where label prints sideways on TSC or Arks printer. This happens because PDF orientation doesn't match printer roll orientation. Rotating 90° fixes it. Also, some Shiprocket AWB PDFs are generated sideways for A4 but need rotation for 4x6.",ecommercePoints:[{title:"Flipkart labels",desc:"Flipkart Ekart labels sometimes generate 90° rotated. Rotate to portrait before cropping to 4x6."},{title:"Meesho thermal",desc:"Meesho labels with barcode on side need 90° rotation for TVS LP 46 printer to feed correctly."},{title:"Amazon FBA",desc:"Amazon FBA box labels often need 180° rotation when printer is mounted upside down in warehouse."}],extraTitle:"Combine rotate with crop and resize",extraPara:"Best workflow for sellers: rotate to correct orientation first, then crop to remove extra invoice, then resize to 4x6. This order prevents cropping wrong area. Always test one label after rotation.",extraPara2:"If you use mobile to print via Bluetooth thermal printer, rotated PDF displays correctly on phone, making packing faster. Keep original for GST audit.",tips:["Rotate before cropping for accurate selection","Use 90° clockwise for most thermal roll issues","Check print preview in printer driver after rotation"],faqs:[{q:"Can I rotate only one page in a 10-page PDF?",a:"Yes. Select page number, apply rotation only to that page. Others stay unchanged."},{q:"Does rotation affect barcode scanning?",a:"No. Rotation preserves resolution. Barcode remains scannable after 90° or 180° rotation."},{q:"Can I rotate scanned image PDF?",a:"Yes. Scanned JPG inside PDF rotates same as text PDF, no quality loss."}]},optimize:{h1:"Compress PDF Online Free - Reduce PDF Size Without Losing Quality",uploadLabel:"Choose PDF to compress",uploadHint:"Reduce invoice and label PDF size for marketplace upload",intro:"PDF file too large for Amazon, Flipkart or Meesho upload? Our Optimize PDF (Compress PDF) tool reduces file size without making text blurry or barcodes unscannable. Free, online, no watermark, secure with auto-delete in 1 hour. Large PDFs happen because of high-resolution scans, embedded images or unoptimized fonts. Our tool uses smart compression: it downsamples images where safe, removes duplicate fonts, and optimizes structure. You can choose compression level: low, medium, high. Ideal for students sending assignments via email, offices archiving reports, and sellers uploading invoices where marketplace limit is 5MB. Works on mobile, handles up to 500 files, 100MB total.",whatTitle:"What is PDF optimization?",whatPara:"Optimize PDF reduces file size while keeping readability. Unlike simple ZIP, it actually compresses inside PDF: images are recompressed at optimal DPI, redundant objects removed. This can reduce a 20MB scanned invoice file to 2MB without visible quality loss.",whatPara2:"We offer balanced compression for business docs. Barcodes remain at higher DPI even when other images compress more. This prevents courier scan failures. You get to choose quality vs size trade-off.",steps:[{title:"Upload PDF",desc:"Choose large PDF - invoice, catalog, assignment. Up to 100MB."},{title:"Choose level",desc:"Select Low (high quality), Medium (balanced), High (smallest size). For labels use Low."},{title:"Compress",desc:"Tool optimizes images and fonts. Takes few seconds for 50-page file."},{title:"Download",desc:"Download smaller PDF. Compare size saved. Ready for upload or email."}],featuresTitle:"Optimization benefits",features:[{title:"Smart image compression",desc:"Keeps barcode area high-res, compresses background images more. Avoids scan fails."},{title:"Font optimization",desc:"Removes duplicate embedded fonts that bloat file size."},{title:"Batch compress",desc:"Compress 100 invoices together for daily upload to Flipkart."},{title:"No watermark",desc:"Clean output, no logo added. Professional for customer sharing."}],ecommerceTitle:"Compress for marketplace uploads",ecommerceIntro:"Marketplaces have upload limits: Amazon invoice upload max 5MB, Flipkart 10MB. Scanned invoices from mobile scanner often exceed this. Compressing helps upload without splitting file. Also saves mobile data when sharing via WhatsApp.",ecommercePoints:[{title:"Amazon Seller Central",desc:"Compress GST invoice PDF to under 5MB for order upload without losing legal text clarity."},{title:"Shiprocket manifest",desc:"Compress 100-page daily manifest from 30MB to 5MB for faster email to courier hub."},{title:"Meesho catalog",desc:"Compress product catalog PDF with many images to share with resellers on WhatsApp (WhatsApp limit 16MB)."}],extraTitle:"How much can you compress without losing barcode?",extraPara:"For shipping labels, use Low compression. It saves 20-30% size while keeping barcode at 300 DPI. For invoices and reports, Medium saves 60-70%. High compression is for archiving old orders where you don't need print quality.",extraPara2:"If compressed barcode becomes unscannable, re-upload original and choose Low. Always test scan with phone after high compression. Combine with Merge: merge many invoices, then compress merged file for CA.",tips:["Use Low for labels, Medium for invoices","Compress after merging to get smallest combined file","Keep original for GST 5-year retention"],faqs:[{q:"Will compress make barcode blurry?",a:"On Low setting no. We keep barcode area at 300 DPI. Medium may slightly soften but still scannable. Test with scanner app."},{q:"How much size reduction can I expect?",a:"Scanned PDFs reduce 60-80%, digital PDFs 20-40% depending on images. A 20MB invoice often becomes 3-4MB."},{q:"Is there file size limit?",a:"Upload up to 100MB combined, 500 files. Output can be as small as few hundred KB."}]},reorder:{h1:"Reorder PDF Pages Online Free - Arrange Pages in Correct Order",uploadLabel:"Choose PDF to reorder",uploadHint:"Drag pages to fix invoice and label sequence",intro:"PDF pages in wrong order? Our Reorder PDF tool lets you drag and drop pages to arrange them correctly in seconds. Free, online, no watermark, secure with auto-delete after 1 hour. Wrong page order happens when scanning invoices, combining files from different sources, or downloading bulk orders where marketplace mixes invoices. Correct order matters for audit, customer presentation and warehouse picking. Tool shows thumbnail preview of each page, you can drag to new position, rotate individual pages while reordering, and download fixed file. Works on mobile too, so you can fix order while on warehouse floor. Supports up to 500 pages preview.",whatTitle:"What is PDF reorder?",whatPara:"Reorder PDF means changing sequence of pages inside PDF without splitting and merging manually. For example, you scanned invoice pages in reverse order, or marketplace PDF has shipping label first but you need invoice first for GST file. With drag-drop interface, you move pages visually.",whatPara2:"Unlike manual methods that need Adobe Acrobat Pro, our tool is free and keeps original quality. No text or barcode re-encoding. Page numbers can be re-added after reordering if needed.",steps:[{title:"Upload PDF",desc:"Choose file with mixed order. Up to 100MB."},{title:"Drag pages",desc:"See thumbnails, drag to new position. Use zoom to identify invoice vs label."},{title:"Rotate if needed",desc:"Rotate individual pages during reorder if some are sideways."},{title:"Save reordered",desc:"Download PDF with correct sequence. Ready for print or audit."}],featuresTitle:"Reorder features",features:[{title:"Visual thumbnails",desc:"See each page preview, easy to identify invoice, label, return form."},{title:"Drag & drop",desc:"Intuitive interface works on touch phones too for warehouse use."},{title:"Rotate in place",desc:"Fix orientation while reordering, no need for separate rotate step."},{title:"No quality loss",desc:"Pages moved as-is, barcodes and fonts stay sharp."}],ecommerceTitle:"Reorder for dispatch efficiency",ecommerceIntro:"Warehouse staff pick faster when PDF order matches physical picking route. For example, arrange orders by pincode or city so delivery boy loads van in sequence. Or keep invoice first, then label, so customer sees bill before shipping details.",ecommercePoints:[{title:"Amazon bulk",desc:"Reorder 50 orders by courier partner: Delhivery orders first, then Ekart for separate handover."},{title:"Flipkart returns",desc:"Put return invoice first, then original invoice for easier Flipkart audit."},{title:"Meesho city sort",desc:"Reorder Meesho orders by city to optimize delivery route and save courier cost."}],extraTitle:"Pro tips for sellers",extraPara:"Use reorder after merging. First merge all daily orders, then reorder by priority (prepaid first, COD later). This helps prioritize packing for prepaid to avoid cancellations. Add page numbers after reordering to keep track.",extraPara2:"For GST, keep invoice sequence financial year wise. Reorder tool helps arrange month-wise for CA. Save time vs manual PDF editors.",tips:["Thumbnail zoom helps read order ID without opening","Reorder prepaid orders to top for faster dispatch","Add page numbers after reordering for tracking"],faqs:[{q:"Can I reorder pages from different PDFs?",a:"First merge PDFs into one, then reorder. Two-step workflow gives full control."},{q:"Will reorder affect file size?",a:"No. File size stays same, only order changes. No recompression."},{q:"Can I reorder on phone?",a:"Yes. Drag works on touch. Use landscape mode for easier dragging on small screens."}]},delete:{h1:"Delete PDF Pages Online Free - Remove Unwanted Pages Instantly",uploadLabel:"Choose PDF to delete pages",uploadHint:"Remove blank, ad, or extra invoice pages",intro:"Have extra blank pages, ads, or wrong invoices in your PDF? Our Delete Pages tool lets you remove specific pages in seconds. Free, online, no watermark, secure with auto-delete after 1 hour. Deleting unwanted pages reduces file size, protects confidential data, and makes documents professional. For example, marketplace PDF includes 4 pages but you need only invoice and label — delete return form and extra ad page. Or remove blank scanned pages that waste paper. Tool shows thumbnails, you select pages to delete, and download clean file. Supports up to 500 files, 100MB, works on mobile.",whatTitle:"What is delete pages?",whatPara:"Delete pages removes selected pages from PDF permanently (in output copy). Original file stays until deleted after 1 hour. You can delete by page number or by visual selection. Useful for removing cover pages, ads, duplicate scans, or sensitive pricing tables before sharing.",whatPara2:"Our tool is safe — it doesn't alter remaining pages. Fonts, barcodes, images stay original quality. No need for expensive software. Perfect for quick cleanup before customer or courier handover.",steps:[{title:"Upload PDF",desc:"Choose file with extra pages. Up to 100MB."},{title:"Select pages to delete",desc:"Click thumbnails or type page numbers like 3,5,8-10."},{title:"Preview",desc:"Check remaining pages count and order."},{title:"Download clean PDF",desc:"Download file without unwanted pages. Auto-delete original after 1 hour."}],featuresTitle:"Why delete pages?",features:[{title:"Remove confidential",desc:"Delete pricing, cost sheet before sharing catalog with customer."},{title:"Save paper",desc:"Remove blank pages that waste thermal paper and ink."},{title:"Professional docs",desc:"Remove ad pages from Meesho labels that look unprofessional to customer."},{title:"Reduce size",desc:"Fewer pages means smaller file for WhatsApp and marketplace upload."}],ecommerceTitle:"Delete pages for marketplace compliance",ecommerceIntro:"Marketplace labels often include extra marketing pages or duplicate invoices. Deleting them saves paper and avoids confusion at courier hub. For example, Meesho label PDF includes promotional page — delete it before printing.",ecommercePoints:[{title:"Amazon invoice",desc:"Delete extra warranty card pages if customer didn't purchase warranty."},{title:"Flipkart manifest",desc:"Remove cancelled orders pages from daily manifest before handing to Ekart."},{title:"Shiprocket",desc:"Delete duplicate AWB pages that occur when you re-download after printer jam."}],extraTitle:"Delete vs split - difference",extraPara:"Delete keeps one file with fewer pages. Split creates multiple files. Use delete when you want single clean file. Use split when you want separate files for each order.",extraPara2:"Always preview after deletion to ensure you didn't delete invoice by mistake. Keep backup of original for GST until audit complete.",tips:["Use thumbnail view to spot blank pages quickly","Delete ads from Meesho labels to save ink","Delete before compressing for smaller size"],faqs:[{q:"Can I delete multiple non-continuous pages?",a:"Yes. Select pages like 2,5,7-9 together. Tool deletes all selected in one go."},{q:"Does deletion affect quality of remaining pages?",a:"No. Remaining pages stay at original quality, barcode sharp."},{q:"Can I recover deleted pages?",a:"You can re-upload original within 1 hour before auto-delete. After that original is gone. Always keep local backup."}]},nup:{h1:"N-UP PDF Online Free - Print Multiple Pages Per Sheet to Save Paper",uploadLabel:"Choose PDF for N-UP layout",uploadHint:"2, 4, 8 pages per sheet for cost saving",intro:"Want to print 2 or 4 PDF pages on one sheet to save paper and courier cost? Our N-UP tool arranges multiple pages onto single sheet. Free, online, no watermark, secure with auto-delete in 1 hour. N-UP means N pages per sheet — 2-UP, 4-UP, 8-UP etc. This is popular for printing shipping labels, invoices, product instructions on one A4 to cut paper cost by 75%. It preserves readability, keeps barcodes scannable, and adds optional borders and page numbers. Perfect for students printing notes, offices printing reports, and sellers printing bulk labels for cost saving. Works on mobile, supports up to 500 files.",whatTitle:"What is N-UP?",whatPara:"N-UP is layout where multiple original PDF pages are shrunk and placed on one physical sheet. For example, 4-UP takes 4 pages and puts them in 2x2 grid on one A4 sheet. This saves paper, ink and is useful for draft printing or when printer cost is high.",whatPara2:"Reverse of this is also useful: you have 4 labels on one A4 and want 4 separate 4x6 labels — that's not N-UP but cropping. N-UP is for combining, cropping is for separating. Our tool offers both directions.",steps:[{title:"Upload PDF",desc:"Choose file with many pages - invoices, labels, notes."},{title:"Choose N-UP layout",desc:"Pick 2, 4, 8, 16 pages per sheet. For labels use 4-UP on A4."},{title:"Set options",desc:"Add border, keep page order left-right or top-bottom, add cut marks for easy cutting."},{title:"Download N-UP PDF",desc:"Download combined sheet PDF ready for economical printing."}],featuresTitle:"N-UP benefits",features:[{title:"Save 75% paper",desc:"4-UP uses 1 sheet instead of 4. Big saving for sellers printing 200 orders daily."},{title:"Cut marks",desc:"Add dotted cut lines so staff can cut A4 into 4 labels quickly with paper cutter."},{title:"Readable",desc:"Smart scaling keeps text readable and barcode scannable even at 4-UP."},{title:"No watermark",desc:"Clean output for customer-facing documents."}],ecommerceTitle:"N-UP for bulk label printing",ecommerceIntro:"If you have single-page 4x6 labels and want to print 4 on one A4 to save laser printer cost, N-UP is ideal. You can print 4 orders on one A4, then cut into 4 slips. Some sellers use A4 laser to print 4 labels, then stick on parcels, avoiding thermal printer cost.",ecommercePoints:[{title:"Cost saving",desc:"Print 4 Meesho orders on one A4 laser sheet instead of 4 thermal rolls - save 3x cost."},{title:"Draft manifests",desc:"Print 8-page daily manifest as 2 sheets (4-UP) for warehouse supervisor quick check."},{title:"Amazon small labels",desc:"N-UP 2 FBA product labels per A4 for inner box labeling."}],extraTitle:"When not to use N-UP for shipping",extraPara:"For courier scanning, single 4x6 per parcel is mandatory. Don't use 4-UP for final courier label — courier scanners expect one label per parcel. Use N-UP only for internal drafts or when you cut A4 into 4 pieces before sticking.",extraPara2:"After N-UP, you can add page numbers to track orders. Keep barcode size at least 2x1 inch after scaling for scanner readability. Test scan after N-UP.",tips:["Use 4-UP with cut marks for easy cutting","Don't use N-UP for final courier AWB - use single 4x6","Add border to see page separation"],faqs:[{q:"Can I print 4 shipping labels on one A4 with N-UP?",a:"Yes, choose 4-UP. You get 4 labels on one A4. Cut them into 4 pieces before pasting on parcels. Ensure each barcode after scaling is at least 2 inch wide."},{q:"Will barcode remain scannable in 4-UP?",a:"Yes if original is high-res. At 4-UP barcode becomes smaller but still scannable if kept above 1.5 inch width. Test with phone scanner."},{q:"Difference between N-UP and Merge?",a:"Merge joins different PDFs as separate pages. N-UP puts multiple pages onto same physical sheet. Use merge for combining orders, N-UP for saving paper."}]},pagenumbers:{h1:"Add Page Numbers to PDF Online Free - Number Invoices & Labels",uploadLabel:"Choose PDF to add page numbers",uploadHint:"Add numbers for audit, manifest tracking",intro:"Need to add page numbers to PDF for audit, manifest or catalog? Our Add Page Numbers tool lets you insert numbers at bottom, top, corner with custom format. Free, online, no watermark, secure with auto-delete in 1 hour. Page numbers are essential for multi-page invoices, legal documents, product catalogs and daily shipping manifests so you can track if any page missing. You can choose position, font size, starting number, format like Page 1 of 10. Tool preserves original quality, doesn't blur barcodes, and works for up to 500 files. Perfect for CAs, lawyers, students and e-commerce sellers handling bulk orders.",whatTitle:"What is page numbering?",whatPara:"Page numbering adds visible numbers onto each PDF page footer or header. Unlike original PDF that may not have numbers, this tool stamps numbers as text layer. Useful for referencing, audit and ensuring no page lost during printing or courier handover.",whatPara2:"You can customize: position (bottom center, bottom right, top left), margin, font size, color, start from specific number. For example, start from 101 for continuation of previous manifest. Supports formats like 1, 1/10, Page 1.",steps:[{title:"Upload PDF",desc:"Choose multi-page PDF - manifest, catalog, invoice set."},{title:"Choose style",desc:"Pick position, format, font size. For warehouse use large font at bottom right."},{title:"Set start number",desc:"Start from 1 or continue from previous batch like 51 for next 50 orders."},{title:"Add & download",desc:"Click Add numbers and download numbered PDF ready for tracking."}],featuresTitle:"Page number features",features:[{title:"Custom position",desc:"Place at 6 positions: top/bottom left/center/right to avoid overlapping barcode."},{title:"Flexible format",desc:"Number only, Page X of Y, X/Y etc. Helps audit."},{title:"Font control",desc:"Choose size and color so number visible but not interfering with label."},{title:"Batch",desc:"Number 500-page manifest in one go."}],ecommerceTitle:"Page numbers for seller manifests",ecommerceIntro:"Daily shipping manifest handed to courier must be numbered. If courier says they received 48 of 50 parcels, you can quickly identify missing by page numbers. Also helps warehouse staff count.",ecommercePoints:[{title:"Courier handover",desc:"Add Page 1 of 50 etc. to daily manifest so courier can't claim shortage."},{title:"Amazon audit",desc:"Number GST invoice set month-wise for CA audit - easy to reference missing invoice."},{title:"Meesho catalog",desc:"Number product catalog PDF for resellers to reference page during order."}],extraTitle:"Best practices",extraPara:"Place page numbers away from barcode area - bottom right is usually safe for labels, bottom center for invoices. Use font size 10-12 for readability without blocking content. For thermal 4x6 labels, avoid page numbers overlapping address - use top margin if needed.",extraPara2:"Add numbers after merging and reordering, as final step before printing. This ensures numbers reflect final order. Keep unnumbered original for digital records.",tips:["Use bottom right for manifests to avoid barcode","Start from 1 for new day, continue for same day batches","Use Page X of Y format for courier proof"],faqs:[{q:"Can I add page numbers without covering barcode?",a:"Yes. Choose position away from barcode - top left or bottom right with margin. Preview before download."},{q:"Can I start numbering from 51?",a:"Yes. Set starting number to 51 for second batch of 50 orders, so continuation is clear."},{q:"Will page numbers affect scan?",a:"No, if placed outside barcode area. Numbers are small text layer, not interfering with barcode."}]}};function Fi(){let[e,n]=Ve.useState("crop"),[t,r]=Ve.useState([]),[l,u]=Ve.useState(!1),[o,i]=Ve.useState(0),a=Ve.useRef(null),f=Ve.useRef(null),h=nm[e];Ve.useEffect(()=>{if(i(0),r([]),f.current&&window.innerWidth<1024)f.current.scrollIntoView({behavior:"smooth",block:"start"})},[e]);let y=(m)=>{if(!m)return;let R=Array.from(m).slice(0,500);r(R)},v=(m)=>{m.preventDefault(),u(!0)},k=(m)=>{m.preventDefault(),u(!1)},E=(m)=>{m.preventDefault(),u(!1),y(m.dataTransfer.files)};return g("div",{className:"min-h-screen bg-[#1e1e1e] text-[#e6e6e6] antialiased selection:bg-white selection:text-black",children:[p("style",{children:`
